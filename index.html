

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favorito-em-branco.png">
  <title>Feliz Aniversário! 🎂</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <audio id="musica" autoplay loop>
    <source src="Ed Sheeran - Photograph (Official Lyric Video) - Ed Sheeran.mp3" type="audio/mpeg">
  </audio>
  <div class="stars"></div>

  <main class="scene">
    <p class="subtitle">Um dia especial ✨</p>

    <h1 id="title">Feliz Aniversário Branquela! 🎉</h1>

    <p class="message" id="message">
      Que seu novo ciclo seja cheio de amor, alegria,
      sonhos realizados e momentos inesquecíveis. 💖
    </p>

    <div class="cake-area">
      <div class="cake-shadow"></div>
      <div class="plate"></div>

      <div class="layer bottom-layer" id="bottom">
        <i class="sprinkle s1"></i>
        <i class="sprinkle s2"></i>
        <i class="sprinkle s3"></i>
        <i class="sprinkle s4"></i>
        <i class="sprinkle s5"></i>
      </div>

      <div class="layer middle-layer" id="middle">
        <i class="sprinkle s1"></i>
        <i class="sprinkle s2"></i>
        <i class="sprinkle s3"></i>
        <i class="sprinkle s4"></i>
      </div>

      <div class="layer top-layer" id="top">
        <i class="sprinkle s1"></i>
        <i class="sprinkle s2"></i>
        <i class="sprinkle s3"></i>
      </div>

      <div class="candle" id="candle">
        <div class="flame" id="flame"></div>
      </div>
    </div>

    <button class="button" id="replay">
      ✨ Assistir novamente
    </button>
  </main>
  <script src="script.js"></script>
  
</body>
</html>
